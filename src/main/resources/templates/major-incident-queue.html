<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><section class="page-heading"><div><span class="eyebrow">INCIDENT COORDINATION</span><h1>Major incidents</h1><p>Review candidates and coordinate restoration, related incidents and follow-up.</p></div></section><section class="panel retention-panel"><h2>Incident queue</h2><form method="get" class="record-form"><label for="major-status">Major process status</label><select id="major-status" name="status"><option th:each="status:${#strings.arraySplit('active,candidate,closed,declined,all', ',')}" th:value="${status}" th:selected="${queue.status==status}" th:text="${#strings.capitalize(status)}"></option></select><button class="button">Filter incidents</button></form><p th:text="${queue.total+' matching incidents'}"></p><ul><li th:each="entry:${queue.items}"><a th:href="@{/record/incident/{id}/major(id=${entry.incident.sys_id})}" th:text="${entry.incident.getOrDefault('short_description','Incident')+' · '+entry.status}"></a></li></ul><a th:if="${queue.next_offset!=null}" th:href="@{/major-incidents(status=${queue.status},limit=${queue.limit},offset=${queue.next_offset})}">Next incidents</a></section></main></html>
