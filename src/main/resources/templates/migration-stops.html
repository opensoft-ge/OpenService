<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><a class="back-link" href="/admin/migrations">Back to Migration studio</a><section class="page-heading"><div><span class="eyebrow">MIGRATION CONTROL</span><h1>Saved migrations</h1><p>Review retained progress before cancelling an unapplied migration.</p></div></section><section class="panel retention-panel"><p th:if="${directory.rows.isEmpty()}">No saved migrations.</p><p th:if="${directory.truncated}">Showing the latest 100 saved migrations. Older jobs remain retained.</p><article th:each="job:${directory.rows}" class="record-form"><h2 class="account-name" th:text="${job.job_id}"></h2><p class="account-name" th:text="${job.source_url}"></p><p th:text="${job.detail.status}"></p><a th:href="@{/admin/migrations/{id}/cancel(id=${job.job_id})}">Review cancellation</a></article></section></main></html>
