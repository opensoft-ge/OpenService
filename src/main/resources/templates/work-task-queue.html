<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><section class="page-heading"><div><span class="eyebrow">TEAM WORK</span><h1>Work tasks</h1><p>Queued and active work for your current teams and cases you can access. Administrators can review all accessible work.</p></div></section><section class="panel retention-panel"><h2 th:text="${queue.total+' open tasks'}"></h2><p th:if="${queue.items.isEmpty()}">No matching tasks on this page.</p><ul><li th:each="task:${queue.items}"><a th:href="@{/record/{table}/{id}/work-tasks(table=${task.parent_table},id=${task.parent_id})}+'#task-'+${task.task_id}" th:text="${task.summary+' · '+task.parent_label+' · '+task.state}"></a></li></ul><a th:if="${queue.next_offset!=null}" th:href="@{/work-tasks(limit=${queue.limit},offset=${queue.next_offset})}">Next tasks</a></section></main></html>
