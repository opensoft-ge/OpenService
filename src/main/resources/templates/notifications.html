<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page">
<section class="page-heading"><div><span class="eyebrow">YOUR WORKSPACE</span><h1>Notifications</h1><p>Business messages for your account. Acknowledge messages after reviewing them.</p></div></section>
<section class="panel retention-panel"><h2>Delivery preference</h2><form method="post"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="operation" value="preference"><label>Business notifications<select name="enabled"><option value="true" th:selected="${enabled}">Enabled</option><option value="false" th:selected="${!enabled}">Disabled</option></select></label><button class="button">Save preference</button></form><p>Account verification and recovery emails are unaffected.</p></section>
<section class="panel retention-panel"><h2>Your messages</h2><p th:if="${#lists.isEmpty(notices)}">No messages yet.</p><article th:each="notice:${notices}"><p th:text="${notice.message}"></p><span th:if="${notice.acknowledged==1}" class="status">Acknowledged</span><form th:if="${notice.acknowledged==0}" method="post"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="notice_id" th:value="${notice.notice_id}"><button class="button">Acknowledge</button></form></article></section>
</main></html>
