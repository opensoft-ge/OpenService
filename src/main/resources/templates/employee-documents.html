<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main><section class="page-heading"><div><span class="eyebrow">EMPLOYEE SERVICES</span><h1>Your case documents</h1><p>Only documents explicitly published for your case are shown. Withdrawn, changed or unavailable documents cannot be downloaded.</p></div></section><section class="panel"><div class="panel-heading"><h2>Published documents</h2></div><p th:if="${documents.documents.isEmpty()}">No current documents have been published.</p><p th:each="file:${documents.documents}"><a th:href="@{/employee-service/cases/{caseId}/documents/{fileId}(caseId=${documents.record_id},fileId=${file.attachment_id})}" th:text="${file.name}"></a><span th:text="${' · '+file.bytes+' bytes'}"></span></p></section></main></html>
