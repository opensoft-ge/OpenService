<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><p><a th:href="${relationPath}">Record relationships</a></p><section class="page-heading"><div><span class="eyebrow">REVIEW EXACT LINK</span><h1 th:text="${page.command.remove ? 'Remove this relationship' : 'Add this relationship'}"></h1><p>Both record revisions, the relationship type and the link revision are checked again when you apply this change.</p></div></section><section class="panel retention-panel"><h2 th:text="${page.record.getOrDefault('short_description',page.record.sys_id)}"></h2><p th:text="${page.command.direction=='outbound' ? page.type.forward_label : page.type.inverse_label}"></p><h3 th:text="${page.related.getOrDefault('short_description',page.related.sys_id)}"></h3><p th:text="${page.type.propagates==1 ? 'While active, the source CI depends on the target CI in impact analysis.' : 'This association does not propagate dependency impact.'}"></p><p>This link does not change either record's business fields or grant access.</p><form class="record-form" method="post" th:action="${relationPath}"><input type="hidden" name="csrf" th:value="${csrf}"><input th:each="value:${page.command}" type="hidden" th:name="${value.key}" th:value="${value.value}"><label>Reason for this relationship change<textarea name="reason" rows="3" required maxlength="2000"></textarea></label><button class="button primary" th:text="${page.command.remove ? 'Apply reviewed removal' : 'Apply reviewed relationship'}"></button></form></section></main></html>
