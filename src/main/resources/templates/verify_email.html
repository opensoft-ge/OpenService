<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Verify your OpenService recovery email</title><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/app.css"></head><body><div class="theme-toolbar"><button th:replace="~{appearance :: toggle}"></button></div><main class="error-page"><span class="eyebrow">ACCOUNT SECURITY</span><h1>Verify recovery email</h1><p th:text="${'Account: '+enrollment.name}"></p><p th:text="${'Email: '+enrollment.email}"></p><p>Confirm this email proof. An address change also requires confirmation in your other mailbox. Once all proofs are complete, your recovery address changes and all existing browser sessions are signed out. If you did not request this, do not confirm.</p><form method="post" class="record-form"><input type="hidden" name="csrf" th:value="${csrf}"><button class="button primary">Verify email address</button></form></main></body></html>
