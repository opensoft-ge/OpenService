<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><a class="back-link" th:href="@{/record/incident/{id}/investigation(id=${incident.sys_id})}">Back to incident investigation</a><section class="page-heading"><div><span class="eyebrow">RELATED PROBLEM</span><h1>Choose an existing problem</h1><p>Search currently readable problems. Linking rechecks access and the incident revision.</p></div></section>
<section class="panel"><form method="get" class="record-form"><label for="problem-query">Search problem summaries</label><input id="problem-query" name="q" maxlength="200" th:value="${query}"><input type="hidden" name="limit" th:value="${search.limit}"><button class="button primary">Find problems</button></form></section>
<section class="panel retention-panel"><h2>Available problems</h2><p th:text="${search.total+' matching problems'}"></p><p th:if="${search.items.isEmpty()}">No readable problems match.</p><form th:each="choice:${search.items}" method="post" th:action="@{/record/incident/{id}/investigation(id=${incident.sys_id})}"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="revision" th:value="${incident.sys_mod_count}"><input type="hidden" name="operation" value="link"><input type="hidden" name="problem_id" th:value="${choice.value}"><p class="account-name" th:text="${choice.label}"></p><button class="button" th:aria-label="${'Link problem: '+choice.label}">Link problem</button></form></section>
<nav class="pagination" aria-label="Problem pages"><a th:if="${search.offset>0}" th:href="@{${pickerPath}(q=${query},limit=${search.limit},offset=${T(java.lang.Math).max(0,search.offset-search.limit)})}">Previous problems</a><a th:if="${search.next_offset!=null}" th:href="@{${pickerPath}(q=${query},limit=${search.limit},offset=${search.next_offset})}">Next problems</a></nav></main></html>
