<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><section class="page-heading"><div><span class="eyebrow">CUSTOMER SERVICE</span><h1>Customer accounts</h1><p>Connect external requesters with their organization and current support team.</p></div></section><section class="panel retention-panel"><h2>Supported organizations</h2><ul><li th:each="account:${page.accounts}"><a th:href="@{/admin/customer-accounts/{id}(id=${account.account_id})}" th:text="${account.name}"></a><span th:text="${account.active==1 ? ' · Active' : ' · Inactive'}"></span></li></ul></section><section class="panel retention-panel"><h2>Create customer account</h2><form method="post" action="/admin/customer-accounts" class="record-form"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="revision" value="0"><label>Account name<input name="name" maxlength="160" required></label><label for="new-support-group">Support team</label><select id="new-support-group" name="group_id" required><option value="">Choose a current team</option><option th:each="group:${page.groups}" th:value="${group.sys_id}" th:text="${group.getOrDefault('short_description','Support team')}"></option></select><label for="account-active">Account availability</label><select id="account-active" name="active"><option value="true">Active</option><option value="false">Inactive</option></select><button class="button primary">Create customer account</button></form></section></main></html>
