<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page">
<section class="page-heading"><div><span class="eyebrow">SELF SERVICE</span><h1>Published knowledge</h1><p>Approved articles for everyone in your workspace.</p></div></section>
<section class="panel"><div class="panel-heading"><h2>Find an answer</h2></div><form class="record-form" action="/knowledge" method="get"><label for="knowledge-query">Search published knowledge</label><input id="knowledge-query" name="q" maxlength="200" th:value="${search.query}"><label for="knowledge-limit">Articles per page</label><input id="knowledge-limit" type="number" name="limit" min="1" max="100" th:value="${search.limit}"><button class="button primary">Search articles</button> <a href="/knowledge">Clear search</a></form></section>
<section class="panel retention-panel"><p th:if="${#lists.isEmpty(articles)}">No published articles match this search.</p><article th:each="article:${articles}"><h2 class="account-name" th:text="${article.title}"></h2><p class="quiet" th:text="${'Version '+article.version+' · '+article.published_at+' UTC'}"></p><p class="knowledge-content" th:text="${article.content}"></p><p><a th:href="@{/knowledge/{id}(id=${article.article_id})}">Read and give feedback</a></p><p th:if="${user.role=='admin'}"><a th:href="@{/admin/knowledge/{id}/versions(id=${article.article_id})}">Compare publication versions</a></p></article></section>
<nav class="pagination" aria-label="Knowledge pages"><span th:text="${search.total+' matching articles'}"></span><div><a th:if="${search.offset>0}" th:href="@{/knowledge(q=${search.query},offset=${search.previous_offset},limit=${search.limit})}">Previous articles</a><a th:if="${search.next_offset>=0}" th:href="@{/knowledge(q=${search.query},offset=${search.next_offset},limit=${search.limit})}">Next articles</a></div></nav>
</main></html>
