<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page">
<section class="page-heading"><div><span class="eyebrow">SELF SERVICE</span><h1>Published knowledge</h1><p>Approved articles for everyone in your workspace.</p></div></section>
<section class="panel retention-panel"><p th:if="${#lists.isEmpty(articles)}">No articles have been published yet.</p><article th:each="article:${articles}"><h2 th:text="${article.title}"></h2><p class="quiet" th:text="${'Version '+article.version+' · '+article.published_at+' UTC'}"></p><p class="knowledge-content" th:text="${article.content}"></p></article></section>
</main></html>
