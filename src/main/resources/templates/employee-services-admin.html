<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><section class="page-heading"><div><span class="eyebrow">EMPLOYEE SERVICES</span><h1>Manage employee services</h1><p>Enroll current accounts and route private HR requests to the right team.</p></div></section><section class="panel retention-panel"><h2>Find an employee account</h2><form method="get" class="record-form" action="/admin/employee-services"><label>Account username<input name="username" maxlength="80" required></label><button class="button">Find account</button></form><form th:if="${page.lookup!=null}" method="post" class="record-form" action="/admin/employee-services"><h3 th:text="${page.lookup.username}"></h3><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="operation" value="employee"><input type="hidden" name="username" th:value="${page.lookup.username}"><input type="hidden" name="revision" th:value="${page.lookup.revision}"><label>Employee department<input name="department" maxlength="80" required th:value="${page.lookup.department}"></label><label for="employee-enrollment">Employee enrollment</label><select id="employee-enrollment" name="active"><option value="true" th:selected="${page.lookup.active==1}">Active employee</option><option value="false" th:selected="${page.lookup.active==0}">Inactive employee</option></select><button class="button primary">Save employee profile</button></form></section><section class="panel retention-panel"><h2>Enrolled profiles</h2><p th:if="${page.employees.isEmpty()}">No employee profiles configured.</p><ul><li th:each="employee:${page.employees}"><a th:href="@{/admin/employee-services(username=${employee.name})}" th:text="${employee.name}"></a><span th:text="${' · '+employee.department+(employee.active==1 ? ' · Active' : ' · Inactive')}"></span></li></ul></section><section class="panel retention-panel"><h2>Create an employee service</h2><form method="post" class="record-form" action="/admin/employee-services"><th:block th:replace="~{employee-service-fields :: service(${newService})}"></th:block></form></section><section class="panel retention-panel" th:each="service:${page.services}"><h2 th:text="${service.name}"></h2><form method="post" class="record-form" action="/admin/employee-services"><th:block th:replace="~{employee-service-fields :: service(${service})}"></th:block></form></section></main></html>
