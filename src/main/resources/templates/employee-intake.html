<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><a class="back-link" href="/employee-service">Your employee services</a><section class="page-heading"><div><span class="eyebrow">EMPLOYEE SERVICES</span><h1 th:text="${page.service.name}"></h1><p th:text="${page.service.description}"></p></div></section><section class="panel retention-panel"><h2>Request HR support</h2><p>Your request and public conversation are visible to you, the current HR service team and administrators. HR staff keep internal notes separately.</p><form method="post" class="record-form" th:action="@{/employee-service/services/{id}(id=${page.service.service_id})}"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="employee_revision" th:value="${page.employee_revision}"><input type="hidden" name="service_revision" th:value="${page.service.revision}"><input type="hidden" name="key" th:value="${intakeKey}"><label>Request summary<input name="summary" maxlength="160" required></label><label>How can HR help?<textarea name="description" maxlength="4000" rows="6" required></textarea></label><button class="button primary">Submit employee case</button></form></section></main></html>
