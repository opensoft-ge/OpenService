<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><section class="page-heading"><div><span class="eyebrow">CUSTOMER SERVICE</span><h1>Customer service</h1><p th:if="${page.account!=null}" th:text="${page.account.name}"></p><p>Submit a support case and follow its progress with your current support team.</p></div></section><section class="panel retention-panel" th:if="${user.role=='requester'}"><h2>Your support agreements</h2><a href="/customer-service/notifications">Customer email preferences</a><p th:if="${page.entitlements.isEmpty()}">No support agreements currently permit a new case. Contact your account administrator.</p><ul><li th:each="entitlement:${page.entitlements}"><a th:href="@{/customer-service/entitlements/{id}(id=${entitlement.entitlement_id})}" th:text="${entitlement.name}"></a><p th:text="${entitlement.description}"></p></li></ul></section><section class="panel retention-panel"><h2>Support cases</h2><p th:text="${page.total+' cases accessible to you'}"></p><ul><li th:each="record:${page.cases}"><a th:href="@{/record/customer_case/{id}(id=${record.sys_id})}" th:text="${record.getOrDefault('short_description','Customer case')}"></a></li></ul><a th:if="${page.next_offset!=null}" th:href="@{/customer-service(limit=${page.limit},offset=${page.next_offset})}">Next support cases</a></section></main></html>
