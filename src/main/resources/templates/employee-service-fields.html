<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="service(service)"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="operation" value="service"><input type="hidden" name="service_id" th:value="${service.service_id}"><input type="hidden" name="revision" th:value="${service.revision}"><label>Service name<input name="name" maxlength="160" required th:value="${service.name}"></label><label>Service description<textarea name="description" rows="4" maxlength="4000" required th:text="${service.description}"></textarea></label><label>Department audience<input name="department" maxlength="80" th:value="${service.department}"></label><p>Leave the department empty to offer this service to all enrolled employees.</p><label th:for="${'hr-team-'+service.service_id}">HR service team</label><select th:id="${'hr-team-'+service.service_id}" name="group_id" required><option value="">Choose a team</option><option th:each="group:${page.groups}" th:value="${group.sys_id}" th:text="${group.getOrDefault('short_description','Team')}" th:selected="${group.sys_id==service.group_id}"></option></select><label th:for="${'hr-active-'+service.service_id}">Service availability</label><select th:id="${'hr-active-'+service.service_id}" name="active"><option value="true" th:selected="${service.active==1}">Available for new requests</option><option value="false" th:selected="${service.active==0}">Closed to new requests</option></select><button class="button primary">Save employee service</button></th:block>
