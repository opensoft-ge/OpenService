<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><a class="back-link" href="/admin/jobs">Back to background work</a><section class="page-heading"><div><span class="eyebrow">EXECUTION RECEIPT</span><h1>Background work details</h1><p class="account-name" th:text="${job.job_id}"></p></div></section><section class="panel retention-panel"><h2>Current state</h2><dl><dt>Kind</dt><dd th:text="${job.kind}"></dd><dt>State</dt><dd th:text="${job.state}"></dd><dt>Attempts</dt><dd th:text="${job.attempts}"></dd><dt>Last error code</dt><dd class="account-name" th:text="${job.error.isEmpty() ? 'None' : job.error}"></dd><dt>Receipt status</dt><dd th:text="${job.receipt_status}"></dd></dl><h2>Retained receipt fields</h2><p>Only the supported receipt fields are shown. Payloads, credentials and arbitrary provider responses are not displayed.</p><dl><th:block th:each="entry:${job.receipt}"><dt th:text="${entry.key}"></dt><dd class="account-name" th:text="${entry.value}"></dd></th:block></dl></section></main></html>
