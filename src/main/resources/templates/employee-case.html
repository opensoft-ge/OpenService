<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><a th:if="${page.employee}" class="back-link" href="/employee-service">Your employee services</a><a th:unless="${page.employee}" class="back-link" th:href="@{/record/hr_case/{id}(id=${page.record.sys_id})}">HR case workspace</a><section class="page-heading"><div><span class="eyebrow" th:text="${page.record.getOrDefault('number','EMPLOYEE CASE')}"></span><h1 th:text="${page.record.getOrDefault('short_description','Employee case')}"></h1><p th:text="${page.states.getOrDefault(page.record.state,page.record.state)}"></p></div></section><section class="panel retention-panel"><h2>Request details</h2><p class="customer-reply-body" th:text="${page.record.description}"></p></section><section class="panel retention-panel"><h2>Conversation with HR</h2><p>Messages here are visible to the employee and the HR service team. Internal notes belong in the staff workspace.</p><p th:if="${page.messages.isEmpty()}">No public messages yet.</p><article th:each="message:${page.messages}"><h3 th:text="${message.actor_name}"></h3><p th:text="${message.created}"></p><p class="customer-reply-body" th:text="${message.body}"></p></article><form th:if="${page.can_publish}" method="post" class="record-form" th:action="${replyPath}"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="record_revision" th:value="${page.record.sys_mod_count}"><input type="hidden" name="revision" th:value="${page.revision}"><input type="hidden" name="key" th:value="${replyKey}"><label>Public message<textarea name="body" maxlength="4000" rows="5" required></textarea></label><button class="button primary">Send public message</button></form></section><section th:if="${!page.onboarding.isEmpty()}" class="panel retention-panel"><h2>Your onboarding progress</h2><article th:each="step:${page.onboarding}"><h3 th:text="${step.display_title}"></h3><p th:text="${step.status}"></p></article></section></main></html>
