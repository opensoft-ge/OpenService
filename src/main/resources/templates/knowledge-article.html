<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><a class="back-link" href="/knowledge">Back to published knowledge</a><section class="page-heading"><div><span class="eyebrow">PUBLISHED KNOWLEDGE</span><h1 class="account-name" th:text="${article.title}"></h1><p th:text="${'Version '+article.version+' · '+article.published_at+' UTC'}"></p></div></section><section class="panel retention-panel"><p class="knowledge-content" th:text="${article.content}"></p><p th:if="${user.role=='admin'}"><a th:href="@{/admin/knowledge/{id}/feedback(id=${article.article_id})}">Review article feedback</a></p></section><section class="panel"><div class="panel-heading"><p><a th:href="@{/knowledge/{id}/assistant(id=${article.article_id})}">Ask about this article</a></p><h2>Your feedback</h2></div><form class="record-form" method="post" th:action="@{/knowledge/{id}/feedback(id=${article.article_id})}"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="version" th:value="${article.version}"><p>Your response is visible to you and workspace administrators. Updating it requests a fresh editorial review. A review does not automatically change the article.</p><p th:if="${feedback!=null}" role="status" th:text="${feedback.reviewed==1 ? 'Reviewed by an administrator' : 'Awaiting editorial review'}"></p><label for="article-helpful">Was this article helpful?</label><select id="article-helpful" name="helpful"><option value="true" th:selected="${feedback==null or feedback.helpful==1}">Yes</option><option value="false" th:selected="${feedback!=null and feedback.helpful==0}">No</option></select><label for="feedback-details">Feedback details</label><textarea id="feedback-details" name="details" maxlength="2000" th:text="${feedback==null ? '' : feedback.details}"></textarea><button class="button primary">Save feedback</button></form></section></main></html>
