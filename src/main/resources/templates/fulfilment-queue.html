<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><section class="page-heading"><div><span class="eyebrow">TEAM WORK</span><h1>Fulfilment queue</h1><p>Work for your current groups, limited to requests you can read. Administrators can recover and reassign any visible task.</p></div></section><section class="panel retention-panel"><h2>Find work</h2><form method="get" class="record-form"><label for="task-state">Task state</label><select id="task-state" name="state"><option th:each="state:${ {'open','queued','in_progress','complete','all'} }" th:value="${state}" th:selected="${state==work.state}" th:text="${state}"></option></select><button class="button">Filter work</button></form><p th:text="${work.total+' matching tasks'}"></p><ul><li th:each="task:${work.result}"><a th:href="@{/requests/{id}/fulfilment(id=${task.request_id})}" th:text="${task.request.getOrDefault('short_description',task.request_id)}"></a><span th:text="${' · '+task.state+' · '+task.group_name}"></span></li></ul><p th:if="${work.result.isEmpty()}">No matching work is available.</p><a th:if="${work.offset>0}" th:href="@{/fulfilment(state=${work.state},limit=${work.limit},offset=${T(java.lang.Math).max(0,work.offset-work.limit)})}">Previous tasks</a> <a th:if="${work.offset+work.limit<work.total and work.offset+work.limit<=1000000}" th:href="@{/fulfilment(state=${work.state},limit=${work.limit},offset=${work.offset+work.limit})}">Next tasks</a></section></main></html>
