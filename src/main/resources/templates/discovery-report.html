<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><p><a th:href="@{/admin/discovery/{id}(id=${report.source_id})}">Discovery source</a></p><section class="page-heading"><div><span class="eyebrow">RECONCILIATION OUTCOME</span><h1 th:text="${report.external_id}"></h1><p th:text="${'Observed '+report.observed_at+' · Imported '+report.created+' UTC'}"></p></div></section><section class="panel retention-panel"><h2>Accepted report evidence</h2><p th:text="${'Source revision '+report.source_revision+' · '+report.outcomes.size()+' configuration items inspected'}"></p><p>An accepted field may already have the observed value. Unchanged outcomes can include ignored fields; inspect each decision. Record links show current values, which may differ from this historical report.</p><article th:each="outcome:${report.outcomes}"><h3><a th:href="@{/record/cmdb_ci/{id}/discovery(id=${outcome.record_id})}" th:text="${outcome.record.getOrDefault('short_description','Configuration item')}"></a></h3><p th:text="${'Outcome: '+outcome.status+' · Saved record revision '+outcome.record_revision}"></p><dl><th:block th:each="field:${outcome.fields}"><dt th:text="${field.key}"></dt><dd th:text="${field.value}"></dd></th:block></dl></article></section></main></html>
