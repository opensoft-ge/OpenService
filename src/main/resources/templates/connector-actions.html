<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><a class="back-link" href="/admin/operations">Back to Operations</a><section class="page-heading"><div><span class="eyebrow">OUTBOUND INTEGRATIONS</span><h1>Connector actions</h1><p>Configure a fixed operation, review its concrete inputs and follow the external attempt.</p></div><a class="button primary" href="/admin/connector-actions/new">Create connector action</a></section><section class="panel retention-panel"><h2>Configured actions</h2><p th:if="${actions.isEmpty()}">No connector actions yet.</p><ul><li th:each="action:${actions}"><a th:href="@{/admin/connector-actions/{id}(id=${action.action_id})}" th:text="${action.name}"></a><span th:text="${' · '+action.method+' · '+action.alias+' · '+(action.active==1 ? 'Active' : 'Inactive')}"></span></li></ul></section></main></html>
