<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><a class="back-link" href="/customer-service">Customer service</a><section class="page-heading"><div><span class="eyebrow" th:text="${page.account.name}"></span><h1>Open a customer case</h1><p th:text="${page.entitlement.name}"></p></div></section><section class="panel retention-panel"><h2>Review your support agreement</h2><p th:text="${page.entitlement.description}"></p><p th:text="${'Available from '+page.entitlement.start+' until '+page.entitlement.end+' (UTC)'}"></p><p th:text="${page.entitlement.case_limit==0 ? 'Unlimited case intake' : page.entitlement.remaining+' case units currently remaining'}"></p><p>Submitting reserves one case unit. Your account, contact and support agreement must still be current when you submit.</p><form method="post" class="record-form" th:action="@{/customer-service/entitlements/{id}(id=${page.entitlement.entitlement_id})}"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="account_revision" th:value="${page.account.revision}"><input type="hidden" name="contact_revision" th:value="${page.contact_revision}"><input type="hidden" name="entitlement_revision" th:value="${page.entitlement.revision}"><input type="hidden" name="key" th:value="${intakeKey}"><label>Case summary<input name="summary" maxlength="160" required></label><label>How can we help?<textarea name="description" maxlength="4000" rows="6" required></textarea></label><button class="button primary">Submit customer case</button></form></section></main></html>
