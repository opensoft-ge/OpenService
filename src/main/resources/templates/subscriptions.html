<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><a class="back-link" href="/account/notifications">Back to notifications</a><section class="page-heading"><div><span class="eyebrow">YOUR RECORD ACTIVITY</span><h1>Followed records</h1><p>Subscriptions never grant record access. You can remove your own subscriptions here even after access is revoked. Up to 100 records per account.</p></div></section><section class="panel retention-panel"><h2>Your subscriptions</h2><p th:if="${page.subscriptions.isEmpty()}">No followed records.</p><article class="retention-panel" th:each="subscription:${page.subscriptions}"><h3 th:text="${subscription.label}"></h3><p th:text="${subscription.definition.categories}"></p><a class="button secondary" th:if="${subscription.available}" th:href="@{/record/{table}/{id}/collaboration(table=${subscription.table_name},id=${subscription.record_id})}">Open current activity</a><form method="post" action="/account/subscriptions"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="record_id" th:value="${subscription.record_id}"><button class="button secondary">Stop following this record</button></form></article></section></main></html>
