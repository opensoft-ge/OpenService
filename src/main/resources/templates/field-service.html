<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><section class="page-heading"><div><span class="eyebrow">FIELD SERVICE</span><h1>Field service</h1><p>Review dispatched visits for your current teams and accessible cases. Open a case work task to dispatch a new visit.</p><a href="/work-tasks">Find team work tasks</a><p th:if="${user.role=='admin'}"><a href="/admin/field-availability">Technician availability</a></p></div></section><section class="panel retention-panel"><h2 th:text="${queue.total+' dispatched tasks'}"></h2><p th:if="${queue.items.isEmpty()}">No dispatched visits on this page.</p><ul><li th:each="task:${queue.items}"><a th:href="@{/record/{table}/{id}/field-dispatch/{task}(table=${task.parent_table},id=${task.parent_id},task=${task.task_id})}" th:text="${task.summary+' · '+task.status}"></a><p th:text="${task.location}"></p></li></ul><a th:if="${queue.next_offset!=null}" th:href="@{/field-service(limit=${queue.limit},offset=${queue.next_offset})}">Next dispatched tasks</a></section></main></html>
