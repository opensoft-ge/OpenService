<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><a class="back-link" href="/knowledge">Back to published knowledge</a><section class="page-heading"><div><span class="eyebrow">PUBLICATION REVIEW</span><h1>Compare knowledge versions</h1><p>Compare immutable publication snapshots. Draft edits are excluded. Changed fields are identified below; text is shown in full.</p></div></section>
<section class="panel"><form class="record-form" method="get"><label for="left-version">Left version</label><input id="left-version" name="left" type="number" min="1" th:max="${comparison.latest_version}" th:value="${comparison.left.version}" required><label for="right-version">Right version</label><input id="right-version" name="right" type="number" min="1" th:max="${comparison.latest_version}" th:value="${comparison.right.version}" required><button class="button primary">Compare versions</button></form></section>
<section class="panel retention-panel"><h2>Changes</h2><p th:text="${comparison.title_changed ? 'Title changed' : 'Title unchanged'}"></p><p th:text="${comparison.content_changed ? 'Body changed' : 'Body unchanged'}"></p></section>
<div class="field-grid"><section class="panel retention-panel" th:each="snapshot:${ {comparison.left,comparison.right} }"><h2 th:text="${'Version '+snapshot.version}"></h2><p th:text="${snapshot.published_at+' UTC'}"></p><p th:text="${snapshot.retired==1 ? 'Retired' : 'Publication snapshot'}"></p><h3 class="account-name" th:text="${snapshot.title}"></h3><p class="knowledge-content" th:text="${snapshot.content}"></p></section></div></main></html>
