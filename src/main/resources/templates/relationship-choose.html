<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><p><a th:href="${relationPath}">Record relationships</a></p><section class="page-heading"><div><span class="eyebrow">CURRENT ENDPOINT AUTHORITY</span><h1>Choose a related record</h1><p th:text="${page.direction=='outbound' ? page.type.forward_label : page.type.inverse_label}"></p></div></section><section class="panel retention-panel"><form class="record-form" method="get" th:action="${relationPath+'/choose'}"><input type="hidden" name="type_id" th:value="${page.type.type_id}"><input type="hidden" name="direction" th:value="${page.direction}"><label>Search related records<input name="q" maxlength="200" th:value="${page.query}"></label><button class="button">Search records</button></form><p th:if="${page.items.isEmpty()}">No matching readable records.</p><p th:each="item:${page.items}"><a th:if="${item.value!=page.record_id}" th:href="@{${relationPath+'/review'}(type_id=${page.type.type_id},direction=${page.direction},related_id=${item.value})}" th:text="${item.label}"></a></p><a th:if="${page.next_offset!=null}" th:href="@{${relationPath+'/choose'}(type_id=${page.type.type_id},direction=${page.direction},q=${page.query},offset=${page.next_offset})}">More matching records</a></section></main></html>
