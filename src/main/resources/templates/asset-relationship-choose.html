<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><a class="back-link" th:href="@{/record/cmdb_ci/{id}/relationships(id=${relations.source.sys_id},direction=${relations.direction})}">Back to direct relationships</a><section class="page-heading"><div><span class="eyebrow">CHOOSE A CONFIGURATION ITEM</span><h1 th:text="${relations.direction=='dependencies' ? 'Add a dependency' : 'Add a dependent'}"></h1><p class="account-name" th:text="${relations.source.getOrDefault('short_description',relations.source.sys_id)}"></p><p th:text="${relations.direction=='dependencies' ? 'This item will depend on the selected item.' : 'The selected item will depend on this item.'}"></p></div></section><section class="panel retention-panel"><h2>Find a configuration item</h2><form method="get"><input type="hidden" name="direction" th:value="${relations.direction}"><label for="asset-query">Search configuration items</label><input id="asset-query" name="q" maxlength="200" th:value="${relations.query}"><button class="button">Find items</button></form><p th:text="${relations.total+' visible search matches'}"></p><ul><li th:each="item:${relations.items}"><p class="account-name" th:text="${item.label}"></p><p th:if="${item.value==relations.source.sys_id}">Current item; a self-dependency is not allowed.</p><form th:unless="${item.value==relations.source.sys_id}" method="post" th:action="@{/record/cmdb_ci/{id}/relationships(id=${relations.source.sys_id})}"><input type="hidden" name="csrf" th:value="${csrf}"><input type="hidden" name="direction" th:value="${relations.direction}"><input type="hidden" name="related_id" th:value="${item.value}"><input type="hidden" name="remove" value="false"><button class="button" th:aria-label="${'Add relationship with '+item.label}">Add relationship</button></form></li></ul><nav class="pagination" aria-label="Configuration item search pages"><a th:if="${relations.offset>0}" th:href="@{/record/cmdb_ci/{id}/relationships/choose(id=${relations.source.sys_id},direction=${relations.direction},q=${relations.query},limit=${relations.limit},offset=${T(java.lang.Math).max(0,relations.offset-relations.limit)})}">Previous items</a><a th:if="${relations.next_offset!=null}" th:href="@{/record/cmdb_ci/{id}/relationships/choose(id=${relations.source.sys_id},direction=${relations.direction},q=${relations.query},limit=${relations.limit},offset=${relations.next_offset})}">Next items</a></nav></section></main></html>
