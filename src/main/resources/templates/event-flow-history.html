<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><section class="page-heading"><div><span class="eyebrow">AUTOMATION</span><h1>Workflow execution history</h1><p th:text="${page.record.number}"></p></div><a class="button" th:href="@{/record/{table}/{id}(table=${table},id=${page.record.sys_id})}">Back to record</a></section><section class="panel retention-panel"><p th:unless="${workEnabled}">Background processing is disabled. Pending triggers wait for the platform worker.</p><p th:if="${page.runs.isEmpty()}">No workflows have triggered for this record.</p><article th:each="run:${page.runs}"><h2 th:text="${run.name}"></h2><p><strong th:text="${run.state}"></strong><span th:text="${' · '+run.created+' · flow revision '+run.flow_revision+' · record revision '+run.record_revision}"></span></p><p th:if="${run.detail.containsKey('error') and !run.detail.error.isEmpty()}" th:text="${#strings.replace(run.detail.error,'_',' ')}"></p><ol th:if="${run.detail.containsKey('steps')}"><li th:each="step:${run.detail.steps}"><span th:text="${step.kind+' · resulting record revision '+step.record_revision}"></span><span th:if="${!step.task_id.isEmpty()}" th:text="${' · task '+step.task_id}"></span></li></ol><a th:if="${user.role=='admin' and run.job_available}" th:href="@{/admin/jobs/{id}(id=${run.job_id})}">View job and attempts</a><p th:if="${!run.job_id.isEmpty() and !run.job_available}">Detailed job history has expired; this workflow receipt remains.</p><hr></article></section></main></html>
