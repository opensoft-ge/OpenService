<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::main})}"><main class="platform-page"><section class="page-heading"><div><span class="eyebrow">EMPLOYEE SERVICES</span><h1>Your employee services</h1><p>Request support from HR and follow your private cases.</p></div></section><section class="panel retention-panel"><h2>Available services</h2><p th:if="${page.services.isEmpty()}">No services are currently available for your employee profile.</p><ul><li th:each="service:${page.services}"><a th:href="@{/employee-service/services/{id}(id=${service.service_id})}" th:text="${service.name}"></a><p th:text="${service.description}"></p></li></ul></section><section class="panel retention-panel"><h2>Your cases</h2><p th:text="${page.total+' cases accessible to you'}"></p><ul><li th:each="record:${page.cases}"><a th:href="@{/employee-service/cases/{id}(id=${record.sys_id})}" th:text="${record.getOrDefault('short_description','Employee case')}"></a></li></ul><a th:if="${page.next_offset!=null}" th:href="@{/employee-service(limit=${page.limit},offset=${page.next_offset})}">Next employee cases</a></section></main></html>
