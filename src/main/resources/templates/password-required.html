<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Change your OpenService password</title><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/app.css"></head><body><div class="theme-toolbar"><button th:replace="~{appearance :: toggle}"></button></div><main class="error-page"><span class="eyebrow">ACCOUNT SECURITY</span><h1>Change your password to continue</h1><p>Your administrator requires a new password. Workspace and API access will resume after you change it and sign in again.</p><div th:if="${error!=null}" class="notice" role="alert" th:text="${error}"></div><form method="post" action="/password-required" class="record-form"><input type="hidden" name="csrf" th:value="${csrf}"><div class="account-field"><label for="required-current">Current password</label><input id="required-current" name="current_password" type="password" autocomplete="current-password" required maxlength="2048"></div><div class="account-field"><label for="required-new">New password</label><input id="required-new" name="new_password" type="password" autocomplete="new-password" required minlength="15" maxlength="2048"></div><p>Use 15–1024 characters and a different password. Your organization’s exclusions also apply.</p><button class="button primary">Change password</button></form><form method="post" action="/logout"><input type="hidden" name="csrf" th:value="${csrf}"><button class="button">Sign out</button></form><p><a href="/forgot">Forgot your password?</a></p></main></body></html>
