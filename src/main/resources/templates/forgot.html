<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recover access · OpenService</title><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/app.css"></head><body><div class="theme-toolbar"><button th:replace="~{appearance :: toggle}"></button></div><main class="error-page"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Recover access</h1><p>Enter the email address verified when you accepted your invitation.</p><p th:if="${submitted}" class="notice success" role="status">If an active account has that verified address, a recovery message will be queued. Check your inbox, or contact your administrator if it does not arrive.</p><form method="post" class="record-form"><input type="hidden" name="csrf" th:value="${csrf}"><label for="recovery-email">Verified email address</label><input id="recovery-email" type="email" name="email" autocomplete="email" maxlength="254" required><button class="button primary">Request recovery email</button></form><p><a href="/login">Back to sign in</a></p></main></body></html>
