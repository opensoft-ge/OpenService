services:
  app:
    ports: !reset []
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the external https URL}
      COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MAIL_STARTTLS: "true"
      MAIL_ALLOW_INSECURE_LOCAL: "false"
  https:
    image: nginx:stable-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    restart: unless-stopped
    ports:
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx-desk.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/openservice/tls:ro
    depends_on:
      app:
        condition: service_healthy
