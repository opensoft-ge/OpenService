name: Java 27 tests and exact line, branch and method coverage
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Temurin 27.0.1.0.2+1
        env:
          JDK_URL: https://github.com/adoptium/temurin27-binaries/releases/download/jdk-27.0.1.0.2%2B1/OpenJDK27U-jdk_x64_linux_hotspot_27.0.1.0.2_1.tar.gz
          JDK_SHA256: 30cb129f6cf299c852cec0feca9ea2a596d2ee9f26d8605d3a253951f6c8b20f
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$JDK_URL" --output "$RUNNER_TEMP/openservice-jdk.tar.gz"
          printf '%s  %s\n' "$JDK_SHA256" "$RUNNER_TEMP/openservice-jdk.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/openservice-jdk"
          tar -xzf "$RUNNER_TEMP/openservice-jdk.tar.gz" -C "$RUNNER_TEMP/openservice-jdk" --strip-components=1
          echo "JAVA_HOME=$RUNNER_TEMP/openservice-jdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/openservice-jdk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/openservice-jdk/bin/java" --version
      - run: ./mvnw -B test-compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test -Dexec.args="install --with-deps chromium"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sh scripts/verify.sh
